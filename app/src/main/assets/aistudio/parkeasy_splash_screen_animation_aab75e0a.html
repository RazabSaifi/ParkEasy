<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ParkEasy — Splash Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  />
  <style>
    :root {
      --bg-black: #000000;
      --pe-green: #18d422;
      --pe-green-glow: rgba(24, 212, 34, 0.34);
      --text-primary: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-black);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      user-select: none;
    }

    /* ==================== PURE SPLASH STAGE ==================== */
    #pe-splash-screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-black);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Subtle Ambient Radial Emerald Backlight behind Emblem */
    .pe-ambient-aura {
      position: absolute;
      width: min(420px, 82vw);
      height: min(420px, 82vw);
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(24, 212, 34, 0.08) 0%,
        rgba(24, 212, 34, 0.02) 44%,
        rgba(0, 0, 0, 0) 72%
      );
      pointer-events: none;
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pe-ambient-aura.pe-active {
      opacity: 1;
      transform: scale(1);
    }

    .pe-stage {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .pe-emblem-svg {
      width: clamp(290px, 76vw, 400px);
      height: auto;
      overflow: visible;
    }

    /* Ribbon 'P' Luxury Light-Sweep Reveal */
    #pe-ribbon-group {
      opacity: 0;
      transform: scale(0.97);
      transform-origin: 222px 112px;
      transition:
        opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.85s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #pe-ribbon-group.pe-active {
      opacity: 1;
      transform: scale(1);
    }

    /* Exact Nestled Eco-Green Leaf Reveal */
    #pe-logo-leaf {
      opacity: 0;
      transform: scale(0.55) rotate(-10deg);
      transform-origin: 152px 197px;
      transition:
        opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.75s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.85s ease;
    }

    #pe-logo-leaf.pe-active {
      opacity: 1;
      transform: scale(1) rotate(0deg);
      filter: drop-shadow(0 0 14px rgba(24, 212, 34, 0.48));
    }

    /* Parking Lock Pulse Ring when car parks in top bay */
    #pe-park-pulse {
      opacity: 0;
      transform-origin: 184px 41px;
    }

    #pe-park-pulse.pe-pulse-active {
      animation: peLockPulse 1.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes peLockPulse {
      0% {
        opacity: 0.92;
        transform: scale(0.45);
      }
      100% {
        opacity: 0;
        transform: scale(2.35);
      }
    }

    /* Exact Geometric ParkEasy™ Wordmark Reveal */
    #pe-brand-wordmark {
      opacity: 0;
      transform: translateY(12px) scale(0.97);
      transform-origin: 210px 258px;
      transition:
        opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
        filter 1s ease;
    }

    #pe-brand-wordmark.pe-active {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: drop-shadow(0 0 22px rgba(24, 212, 34, 0.24));
    }

    /* Hidden replay button inside embedded splash */
    .pe-replay-btn {
      display: none !important;
    }
  </style>
</head>
<body>
  <main id="pe-splash-screen" aria-label="ParkEasy Splash Animation">
    <div class="pe-ambient-aura" id="pe-ambient-aura"></div>

    <div class="pe-stage">
      <!-- Precision Vector Recreation Matching Exact Original ParkEasy Logo Geometry -->
      <svg
        class="pe-emblem-svg"
        viewBox="0 0 420 295"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-label="ParkEasy Logo Animation"
      >
        <defs>
          <!-- Pure Crisp White Ribbon Fill Matching Original Logo -->
          <linearGradient id="peRibbonWhite" x1="150" y1="22" x2="296" y2="195" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="82%" stop-color="#F7F9FB" />
            <stop offset="100%" stop-color="#EBEEF3" />
          </linearGradient>

          <!-- Exact Vibrant Eco-Green Leaf (#18D422 / #1ED728) -->
          <linearGradient id="peLeafGreen" x1="151" y1="198" x2="207" y2="147" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#14BE1E" />
            <stop offset="55%" stop-color="#18D422" />
            <stop offset="100%" stop-color="#35E63F" />
          </linearGradient>

          <!-- Subtle Emerald Navigation Route Glow -->
          <filter id="peGreenGlow" x="-35%" y="-35%" width="170%" height="170%">
            <feGaussianBlur stdDeviation="3.2" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>

          <!-- Understated Dark-Silver / Graphite Luxury EV Body -->
          <linearGradient id="evGraphiteBody" x1="-17" y1="-8" x2="17" y2="8" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#475569" />
            <stop offset="32%" stop-color="#94A3B8" />
            <stop offset="58%" stop-color="#CBD5E1" />
            <stop offset="100%" stop-color="#64748B" />
          </linearGradient>

          <!-- Obsidian Panoramic Glass Canopy -->
          <linearGradient id="evGlassCanopy" x1="-10" y1="-5" x2="9" y2="5" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#05070A" />
            <stop offset="50%" stop-color="#11161F" />
            <stop offset="100%" stop-color="#070A0E" />
          </linearGradient>

          <!-- Crisp LED Headlight Cone -->
          <linearGradient id="evHeadlightBeam" x1="15" y1="0" x2="44" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72" />
            <stop offset="55%" stop-color="#DCFCE7" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
          </linearGradient>

          <!-- Warm Red Rear Light Trail -->
          <linearGradient id="evTailTrail" x1="-16" y1="0" x2="-32" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FF3B30" stop-opacity="0.65" />
            <stop offset="100%" stop-color="#FF3B30" stop-opacity="0" />
          </linearGradient>
        </defs>

        <!-- 1. EXACT OPEN-STEM GEOMETRIC WHITE 'P' RIBBON -->
        <g id="pe-ribbon-group">
          <path
            d="M 164 22
               H 240
               C 282 22, 307 45, 307 78
               C 307 111, 282 133, 240 133
               H 203
               C 175 133, 157 148, 146 184
               L 142 198
               C 141 180, 143 160, 149 140
               C 158 111, 178 96, 211 96
               H 238
               C 256 96, 267 89, 267 78
               C 267 67, 256 60, 238 60
               H 154
               L 164 22 Z"
            fill="url(#peRibbonWhite)"
          />
        </g>

        <!-- 2. SUBTLE EMERALD NAVIGATION ROUTE LINE ALONG CENTER OF 'P' CURVE -->
        <path
          id="pe-p-route-path"
          d="M 145 190
             C 153 142, 174 114, 209 114
             H 239
             C 269 114, 287 99, 287 78
             C 287 57, 269 41, 239 41
             H 184"
          stroke="#18D422"
          stroke-width="3.6"
          stroke-linecap="round"
          filter="url(#peGreenGlow)"
          fill="none"
        />

        <!-- Soft Emerald Parking-Lock Halo Pulse at Top Horizontal Bay -->
        <circle
          id="pe-park-pulse"
          cx="184"
          cy="41"
          r="10.5"
          stroke="#18D422"
          stroke-width="1.8"
          fill="none"
        />

        <!-- 3. EXACT VIBRANT GREEN ALMOND/TEARDROP LEAF NESTLED UNDERNEATH -->
        <g id="pe-logo-leaf">
          <path
            d="M 151 198
               C 156 168, 176 149, 207 147
               C 202 177, 183 195, 151 198 Z"
            fill="url(#peLeafGreen)"
          />
        </g>

        <!-- 4. MINIMALIST TOP-DOWN GRAPHITE-SILVER LUXURY ELECTRIC COUPE -->
        <g id="pe-ev-car" transform="translate(145, 190) rotate(-80)">
          <!-- Soft Under-Chassis Ambient Shadow -->
          <ellipse cx="-0.5" cy="1" rx="18" ry="9.4" fill="#000000" opacity="0.68" />

          <!-- Warm Red Rear Motion Trail -->
          <g id="pe-tail-trails" opacity="0.65">
            <rect x="-29" y="-5.6" width="13.5" height="2" rx="1" fill="url(#evTailTrail)" />
            <rect x="-29" y="3.6" width="13.5" height="2" rx="1" fill="url(#evTailTrail)" />
          </g>

          <!-- Crisp LED Headlight Projection Cone -->
          <polygon
            id="pe-headlight-cone"
            points="14,-5.2 42,-10.5 42,10.5 14,5.2"
            fill="url(#evHeadlightBeam)"
          />

          <!-- Sculpted Dark-Silver / Graphite Metallic Body -->
          <path
            d="M -15.5 -5.8
               C -15.5 -7.3, -13.6 -8.2, -10.8 -8.2
               L 8.8 -7.9
               C 13.2 -7.7, 16.2 -5.8, 16.5 -2.6
               L 16.5 2.6
               C 16.2 5.8, 13.2 7.7, 8.8 7.9
               L -10.8 8.2
               C -13.6 8.2, -15.5 7.3, -15.5 5.8 Z"
            fill="url(#evGraphiteBody)"
            stroke="#090D14"
            stroke-width="0.9"
          />

          <!-- Subtle Hood Contour Lines -->
          <path d="M 6.0 -4.8 L 13.4 -3.8" stroke="#E2E8F0" stroke-width="0.65" stroke-linecap="round" opacity="0.55" />
          <path d="M 6.0 4.8 L 13.4 3.8" stroke="#E2E8F0" stroke-width="0.65" stroke-linecap="round" opacity="0.55" />

          <!-- Flush Aero Side Mirrors -->
          <path d="M 3.2 -8.0 L 4.8 -10.0 L 6.0 -9.6 L 5.1 -7.9 Z" fill="#94A3B8" stroke="#0F172A" stroke-width="0.45" />
          <path d="M 3.2 8.0 L 4.8 10.0 L 6.0 9.6 L 5.1 7.9 Z" fill="#94A3B8" stroke="#0F172A" stroke-width="0.45" />

          <!-- Obsidian Panoramic Glass Roof -->
          <path
            d="M -10.4 -5.3
               C -5.0 -5.9, 2.0 -5.8, 6.6 -4.8
               C 8.8 -4.2, 9.8 -2.4, 9.8 0
               C 9.8 2.4, 8.8 4.2, 6.6 4.8
               C 2.0 5.8, -5.0 5.9, -10.4 5.3
               C -11.9 4.9, -12.6 2.8, -12.6 0
               C -12.6 -2.8, -11.9 -4.9, -10.4 -5.3 Z"
            fill="url(#evGlassCanopy)"
          />

          <!-- Subtle Glass Specular Reflection -->
          <path
            d="M -6.2 -3.3 C -1.4 -3.7, 2.8 -3.4, 5.6 -2.4"
            stroke="rgba(255, 255, 255, 0.26)"
            stroke-width="1"
            stroke-linecap="round"
          />

          <!-- Crisp White LED Daytime Running Light Blades -->
          <path
            d="M 13.2 -6.8 L 15.7 -5.0 L 15.3 -3.3"
            stroke="#FFFFFF"
            stroke-width="1.35"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M 13.2 6.8 L 15.7 5.0 L 15.3 3.3"
            stroke="#FFFFFF"
            stroke-width="1.35"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <!-- Warm Red Full-Width Rear Light Bar -->
          <path
            id="pe-tail-bar"
            d="M -15.1 -5.8 L -15.1 5.8"
            stroke="#FF3B30"
            stroke-width="1.55"
            stroke-linecap="round"
            opacity="0.82"
          />
        </g>

        <!-- 5. EXACT GEOMETRIC PARKEASY™ WORDMARK -->
        <g id="pe-brand-wordmark">
          <text
            x="208"
            y="264"
            text-anchor="middle"
            fill="#FFFFFF"
            font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif"
            font-size="56"
            font-weight="800"
            letter-spacing="-1.8"
          >ParkEasy</text>
          <text
            x="342"
            y="231"
            fill="#FFFFFF"
            font-family="'Plus Jakarta Sans', sans-serif"
            font-size="10.5"
            font-weight="700"
            letter-spacing="0.4"
            opacity="0.9"
          >TM</text>
        </g>
      </svg>
    </div>
  </main>

  <!-- Minimal Glassmorphic Replay Pill -->
  <button id="pe-replay-btn" class="pe-replay-btn" type="button" aria-label="Replay Animation">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
      <path d="M3 3v5h5" />
    </svg>
    <span>Replay Animation</span>
  </button>

  <script>
    (function initParkEasySplash() {
      const ambientAura = document.getElementById('pe-ambient-aura');
      const ribbonGroup = document.getElementById('pe-ribbon-group');
      const routePath = document.getElementById('pe-p-route-path');
      const evCar = document.getElementById('pe-ev-car');
      const tailTrails = document.getElementById('pe-tail-trails');
      const tailBar = document.getElementById('pe-tail-bar');
      const headlightCone = document.getElementById('pe-headlight-cone');
      const parkPulse = document.getElementById('pe-park-pulse');
      const logoLeaf = document.getElementById('pe-logo-leaf');
      const brandWordmark = document.getElementById('pe-brand-wordmark');
      const replayBtn = document.getElementById('pe-replay-btn');

      const DRIVE_DURATION = 2300;
      const pathLength = routePath.getTotalLength();

      let rafId = null;
      let timers = [];

      function clearSequence() {
        if (rafId) cancelAnimationFrame(rafId);
        timers.forEach((id) => clearTimeout(id));
        timers = [];
      }

      function easeOutQuart(t) {
        return 1 - Math.pow(1 - t, 4);
      }

      function setCarPosition(progress) {
        const dist = progress * pathLength;
        const pt = routePath.getPointAtLength(dist);

        const delta = 1.6;
        const p1 = routePath.getPointAtLength(Math.max(0, dist - delta));
        const p2 = routePath.getPointAtLength(Math.min(pathLength, dist + delta));
        const angleDeg = (Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180) / Math.PI;

        evCar.setAttribute(
          'transform',
          `translate(${pt.x.toFixed(2)}, ${pt.y.toFixed(2)}) rotate(${angleDeg.toFixed(2)})`
        );

        routePath.style.strokeDashoffset = (pathLength - dist).toFixed(2);

        const speedFactor = Math.max(0, 1 - Math.pow(progress, 2.2));
        tailTrails.setAttribute('opacity', (speedFactor * 0.85).toFixed(2));

        const isBraking = progress > 0.68 && progress < 0.99;
        tailBar.setAttribute('opacity', isBraking ? '1' : '0.72');
      }

      function triggerParkLockFeedback() {
        parkPulse.classList.remove('pe-pulse-active');
        void parkPulse.offsetWidth;
        parkPulse.classList.add('pe-pulse-active');

        headlightCone.setAttribute('opacity', '1');
        timers.push(setTimeout(() => headlightCone.setAttribute('opacity', '0.3'), 115));
        timers.push(setTimeout(() => headlightCone.setAttribute('opacity', '1'), 230));
        timers.push(setTimeout(() => headlightCone.setAttribute('opacity', '0.72'), 400));
      }

      function playSplash() {
        clearSequence();

        ambientAura.classList.remove('pe-active');
        ribbonGroup.classList.remove('pe-active');
        logoLeaf.classList.remove('pe-active');
        brandWordmark.classList.remove('pe-active');
        parkPulse.classList.remove('pe-pulse-active');
        replayBtn.classList.remove('pe-visible');
        headlightCone.setAttribute('opacity', '0.82');

        routePath.style.strokeDasharray = `${pathLength}`;
        routePath.style.strokeDashoffset = `${pathLength}`;
        setCarPosition(0);

        timers.push(
          setTimeout(() => {
            ambientAura.classList.add('pe-active');
            ribbonGroup.classList.add('pe-active');
          }, 90)
        );

        timers.push(
          setTimeout(() => {
            logoLeaf.classList.add('pe-active');
          }, 220)
        );

        let startTime = null;

        function animate(timestamp) {
          if (!startTime) startTime = timestamp;
          const elapsed = timestamp - startTime;
          const rawProgress = Math.min(elapsed / DRIVE_DURATION, 1);
          const eased = easeOutQuart(rawProgress);

          setCarPosition(eased);

          if (rawProgress < 1) {
            rafId = requestAnimationFrame(animate);
          } else {
            triggerParkLockFeedback();

            timers.push(
              setTimeout(() => {
                brandWordmark.classList.add('pe-active');
              }, 140)
            );

            timers.push(
              setTimeout(() => {
                replayBtn.classList.add('pe-visible');
                window.dispatchEvent(new CustomEvent('parkeasy:splashComplete'));
                if (window.AndroidSplash && typeof window.AndroidSplash.onSplashComplete === 'function') {
                  window.AndroidSplash.onSplashComplete();
                }
              }, 900)
            );
          }
        }

        rafId = requestAnimationFrame(animate);
      }

      replayBtn.addEventListener('click', playSplash);
      window.addEventListener('DOMContentLoaded', playSplash);
    })();
  </script>
</body>
</html>
